<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>단답형 시험 암기 트레이너 (갤럭시 탭 전용)</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --blank-bg: #1e293b;
      --badge-bg: #eff6ff;
      --dropzone-bg: #f1f5f9;
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --danger: #f87171;
      --blank-bg: #f1f5f9;
      --badge-bg: #1e3a8a;
      --dropzone-bg: #0b1329;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important; /* 안드로이드 및 삼성 인터넷 컨텍스트 팝업 강제 차단 */
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px 12px 100px 12px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .mode-guide {
      background: var(--badge-bg);
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mode-guide b {
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .tab-header {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      background: none;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .tab-btn.active {
      color: var(--primary);
      background: var(--badge-bg);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .dropzone {
      border: 2px dashed var(--border);
      background: var(--dropzone-bg);
      padding: 24px 16px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }
    .dropzone input {
      display: none;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.95rem;
      resize: vertical;
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    button {
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
      touch-action: manipulation;
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    button.active-danger {
      background: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #fff !important;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-count {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .sentence-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      position: relative;
    }
    .item-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 24px;
      padding-top: 5px;
    }
    
    .sentence-content {
      flex: 1;
      font-size: 1.1rem;
      line-height: 2.2;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      touch-action: pan-y; /* 수직 스크롤은 유지하되 수평 드래그 캡처 */
    }

    /* 단어 토큰 */
    .word-token {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.1s;
    }

    /* 드래그 긁는 중 하이라이트 상태 */
    .word-token.dragging-active {
      background-color: #fef08a !important;
      color: #854d0e !important;
      outline: 2px dashed #eab308;
    }

    /* 빈칸 모드 */
    .word-token.is-blank {
      background-color: var(--blank-bg);
      color: transparent !important;
      border-bottom: 2px solid var(--primary);
    }
    .word-token.is-blank.revealed {
      background-color: transparent !important;
      color: var(--primary) !important;
      font-weight: 700;
    }
    body.dark .word-token.is-blank.revealed {
      color: #93c5fd !important;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
    }

    /* 하단 제어 바 */
    .mobile-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 99999;
      backdrop-filter: blur(10px);
    }
    .mobile-bar button {
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
    }

    #loadingSpinner {
      display: none;
      font-size: 0.85rem;
      color: var(--primary);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎯 단답형 암기 트레이너 (갤럭시 탭)</h1>
      <button onclick="toggleTheme()">🌓 테마</button>
    </header>

    <div class="mode-guide">
      <div>✍️ <b>넓게 가리기:</b> 손가락이나 S펜으로 단어를 <b>누른 채 옆으로 쭉 긁으면(드래그)</b> 범위 전체가 즉시 가려집니다!</div>
      <div>👆 <b>단어 1개 가리기:</b> 단어를 가볍게 <b>'톡' 터치</b>하면 바로 빈칸이 됩니다.</div>
      <div>👁️ <b>정답 확인:</b> 빈칸을 톡 누르면 파랗게 답이 보이고, 다시 누르면 가려집니다.</div>
    </div>

    <div class="card">
      <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('textTab')">직접 문장 입력</button>
        <button class="tab-btn" onclick="switchTab('fileTab')">📁 PDF / PPTX 업로드</button>
      </div>

      <div id="textTab" class="tab-content active">
        <textarea id="rawInput" placeholder="암기할 문장을 줄 단위로 붙여넣으세요."></textarea>
        <div class="btn-row">
          <button class="primary" onclick="handleAddText()">문장 등록하기</button>
          <button onclick="cleanUpSpacingInput()">띄어쓰기 정리</button>
          <button onclick="clearInput()">비우기</button>
        </div>
      </div>

      <div id="fileTab" class="tab-content">
        <div class="dropzone" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept=".pdf, .pptx" onchange="handleFileSelect(event)">
          <div style="font-size: 0.95rem; color: var(--text-muted);">
            📄 <b>PDF</b> 또는 📊 <b>PPTX</b> 파일을 터치하여 업로드하세요.
          </div>
        </div>
        <div id="loadingSpinner">⏳ 파일을 읽어 문장을 분리하는 중입니다...</div>
      </div>
    </div>

    <div class="controls-bar">
      <div class="status-count">
        총 <b id="sentenceCount">0</b>개 문장 (가려진 빈칸: <b id="blankCount">0</b>개)
      </div>
      <div class="btn-row" style="margin-top: 0;">
        <button onclick="sortSentences('asc')">가나다순</button>
        <button onclick="shuffleSentences()">무작위 셔플</button>
        <button onclick="resetAll()">전체 삭제</button>
      </div>
    </div>

    <div class="sentence-list" id="sentenceList"></div>
  </div>

  <div class="mobile-bar">
    <button id="eraseModeToggleBtn" onclick="toggleEraseMode()">🗑️ 빈칸 해제 모드</button>
    <button class="primary" onclick="toggleAllBlanks()">전체 열기/닫기</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let sentencesData = [];
    let isAllRevealed = false;
    let isEraseMode = false;

    // 제스처 드래그 엔진 변수
    let isPointerDragging = false;
    let dragStartIndex = -1;
    let currentDragSentenceIndex = -1;
    let draggedTokenIndices = new Set();
    let dragPointerMoved = false;

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('study_tab_sentences');
      if (saved) {
        try {
          sentencesData = JSON.parse(saved);
          renderList();
        } catch(e) {}
      }
      if (localStorage.getItem('theme_dark') === 'true') {
        document.body.classList.add('dark');
      }

      // 우클릭 및 롱프레스 팝업 방지
      document.addEventListener('contextmenu', e => e.preventDefault());
    });

    function saveState() {
      localStorage.setItem('study_tab_sentences', JSON.stringify(sentencesData));
      updateCounts();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      localStorage.setItem('theme_dark', document.body.classList.contains('dark'));
    }

    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (id === 'textTab') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('textTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('fileTab').classList.add('active');
      }
    }

    function normalizeSpacing(str) {
      return str.replace(/[\t\r\f]+/g, ' ').replace(/\s+/g, ' ').replace(/\s*([,.;?!])\s*/g, '$1 ').trim();
    }

    function cleanUpSpacingInput() {
      const el = document.getElementById('rawInput');
      el.value = el.value.split('\n').map(normalizeSpacing).filter(l => l.length > 0).join('\n');
    }

    function clearInput() { document.getElementById('rawInput').value = ''; }

    function handleAddText() {
      const text = document.getElementById('rawInput').value;
      if (!text.trim()) return;

      const lines = text.split('\n').map(normalizeSpacing).filter(l => l.length > 0);
      lines.forEach(line => {
        const words = line.split(' ').map(w => ({ text: w, isBlank: false, revealed: false }));
        sentencesData.push({ id: Date.now() + Math.random(), words: words });
      });

      document.getElementById('rawInput').value = '';
      saveState();
      renderList();
    }

    /* ================= S펜 및 터치 드래그 가리기 엔진 ================= */
    function onTokenPointerDown(e, sIndex, wIndex) {
      if (isEraseMode) return;
      isPointerDragging = true;
      dragPointerMoved = false;
      currentDragSentenceIndex = sIndex;
      dragStartIndex = wIndex;
      draggedTokenIndices.clear();
      draggedTokenIndices.add(wIndex);

      e.target.classList.add('dragging-active');
    }

    function onPointerMoveGlobal(e) {
      if (!isPointerDragging || currentDragSentenceIndex === -1) return;
      
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (el && el.classList.contains('word-token')) {
        const sIdx = parseInt(el.dataset.sindex);
        const wIdx = parseInt(el.dataset.windex);

        if (sIdx === currentDragSentenceIndex) {
          dragPointerMoved = true;
          // 시작 단어부터 현재 긁은 단어까지 연속 범위 자동 계산
          const min = Math.min(dragStartIndex, wIdx);
          const max = Math.max(dragStartIndex, wIdx);
          
          draggedTokenIndices.clear();
          for (let i = min; i <= max; i++) {
            draggedTokenIndices.add(i);
          }

          // 화면 하이라이트 반영
          document.querySelectorAll(`.word-token[data-sindex="${sIdx}"]`).forEach(token => {
            const idx = parseInt(token.dataset.windex);
            if (draggedTokenIndices.has(idx)) {
              token.classList.add('dragging-active');
            } else {
              token.classList.remove('dragging-active');
            }
          });
        }
      }
    }

    function onPointerUpGlobal(e) {
      if (!isPointerDragging) return;

      if (dragPointerMoved && draggedTokenIndices.size > 0 && currentDragSentenceIndex !== -1) {
        // 넓게 긁었을 때: 선택된 모든 단어를 일괄 빈칸으로 변환!
        draggedTokenIndices.forEach(wIdx => {
          sentencesData[currentDragSentenceIndex].words[wIdx].isBlank = true;
          sentencesData[currentDragSentenceIndex].words[wIdx].revealed = false;
        });
        saveState();
      }

      isPointerDragging = false;
      dragPointerMoved = false;
      currentDragSentenceIndex = -1;
      dragStartIndex = -1;
      draggedTokenIndices.clear();

      document.querySelectorAll('.word-token').forEach(el => el.classList.remove('dragging-active'));
      renderList();
    }

    window.addEventListener('pointermove', onPointerMoveGlobal);
    window.addEventListener('pointerup', onPointerUpGlobal);
    window.addEventListener('pointercancel', onPointerUpGlobal);

    // 단순 터치(클릭) 처리
    function handleTokenClick(sIndex, wIndex) {
      if (dragPointerMoved) return; // 긁는 동작이었으면 단일 클릭 무시

      const wordObj = sentencesData[sIndex].words[wIndex];

      if (isEraseMode) {
        if (wordObj.isBlank) {
          wordObj.isBlank = false;
          wordObj.revealed = false;
          saveState();
          renderList();
        }
        return;
      }

      // 일반 단일 탭:
      if (wordObj.isBlank) {
        wordObj.revealed = !wordObj.revealed; // 정답 보기/가리기 토글
      } else {
        wordObj.isBlank = true; // 바로 빈칸 생성
        wordObj.revealed = false;
      }

      saveState();
      renderList();
    }

    function toggleEraseMode() {
      isEraseMode = !isEraseMode;
      const btn = document.getElementById('eraseModeToggleBtn');
      if (isEraseMode) {
        btn.classList.add('active-danger');
        btn.textContent = '✖️ 빈칸 해제 모드 중 (탭하면 복원)';
      } else {
        btn.classList.remove('active-danger');
        btn.textContent = '🗑️ 빈칸 해제 모드';
      }
    }

    /* ================= 화면 렌더링 ================= */
    function renderList() {
      const container = document.getElementById('sentenceList');
      container.innerHTML = '';

      sentencesData.forEach((s, sIndex) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'sentence-item';

        const numDiv = document.createElement('div');
        numDiv.className = 'item-num';
        numDiv.textContent = sIndex + 1;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'sentence-content';

        s.words.forEach((w, wIndex) => {
          const span = document.createElement('span');
          span.className = 'word-token';
          span.textContent = w.text;
          span.dataset.sindex = sIndex;
          span.dataset.windex = wIndex;

          if (w.isBlank) {
            span.classList.add('is-blank');
            if (w.revealed || isAllRevealed) {
              span.classList.add('revealed');
            }
          }

          // 포인터 이벤트 연결
          span.onpointerdown = (e) => onTokenPointerDown(e, sIndex, wIndex);
          span.onclick = () => handleTokenClick(sIndex, wIndex);

          contentDiv.appendChild(span);
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.textContent = '✕';
        delBtn.onclick = () => {
          sentencesData.splice(sIndex, 1);
          saveState();
          renderList();
        };

        itemDiv.appendChild(numDiv);
        itemDiv.appendChild(contentDiv);
        itemDiv.appendChild(delBtn);
        container.appendChild(itemDiv);
      });

      updateCounts();
    }

    function toggleAllBlanks() {
      isAllRevealed = !isAllRevealed;
      sentencesData.forEach(s => {
        s.words.forEach(w => {
          if (w.isBlank) w.revealed = isAllRevealed;
        });
      });
      renderList();
    }

    function resetAll() {
      if (!confirm('모든 문장을 삭제하시겠습니까?')) return;
      sentencesData = [];
      saveState();
      renderList();
    }

    function sortSentences(type) {
      if (type === 'asc') {
        sentencesData.sort((a,b) => getSentenceText(a).localeCompare(getSentenceText(b)));
      }
      saveState();
      renderList();
    }

    function shuffleSentences() {
      for (let i = sentencesData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sentencesData[i], sentencesData[j]] = [sentencesData[j], sentencesData[i]];
      }
      saveState();
      renderList();
    }

    function getSentenceText(s) {
      return s.words.map(w => w.text).join(' ');
    }

    function updateCounts() {
      document.getElementById('sentenceCount').textContent = sentencesData.length;
      let count = 0;
      sentencesData.forEach(s => {
        s.words.forEach(w => {
          if (w.isBlank) count++;
        });
      });
      document.getElementById('blankCount').textContent = count;
    }

    /* ================= PDF / PPTX 파싱 ================= */
    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const spinner = document.getElementById('loadingSpinner');
      spinner.style.display = 'block';

      try {
        const ext = file.name.split('.').pop().toLowerCase();
        let extracted = [];
        if (ext === 'pdf') {
          const ab = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
          let txt = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            txt += content.items.map(it => it.str).join(' ') + '\n';
          }
          extracted = splitLines(txt);
        } else if (ext === 'pptx') {
          const zip = await JSZip.loadAsync(file);
          let txt = '';
          const slideFiles = Object.keys(zip.files).filter(k => k.startsWith('ppt/slides/slide') && k.endsWith('.xml'));
          for (let sf of slideFiles) {
            const xml = await zip.files[sf].async('string');
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            const nodes = doc.getElementsByTagName('a:t');
            for (let n of nodes) txt += n.textContent + ' ';
            txt += '\n';
          }
          extracted = splitLines(txt);
        }

        extracted.forEach(line => {
          const words = line.split(' ').map(w => ({ text: w, isBlank: false, revealed: false }));
          sentencesData.push({ id: Date.now() + Math.random(), words: words });
        });

        saveState();
        renderList();
        alert(`${extracted.length}개의 문장을 가져왔습니다.`);
      } catch(err) {
        alert('파싱 오류: ' + err.message);
      } finally {
        spinner.style.display = 'none';
        document.getElementById('fileInput').value = '';
      }
    }

    function splitLines(text) {
      return text.split(/\n+/).map(normalizeSpacing).filter(l => l.length > 5);
    }
  </script>
</body>
</html>
